<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>NHJYQC - Audio</title>
    <style>
        html {
        font-family: Arial, Helvetica, sans-serif;
        }

        main {
            display: block;
            width: fit-content;
            border-bottom: 4px solid gray;
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Audió - zene, hang - lejátszása_NHJYQC</h1>
    </header>

    <main>
        <audio id="audio" src="jazzy.mp3" controls style="width: 600px"></audio>
        <audio id="yes" src="yes.mp3"></audio>
        <audio id="no" src="no.mp3"></audio>

    <br>
    <div>
        <button id="startstop">Indítás/Leállítás</button>
        <button id="positive">Pozitív</button>
        <button id="negative">Negatív</button>
    </div>
    <br>
    <div>
        <button id="mute">Néma</button>
        <button id="quite">Halk</button>
        <button id="loud">Hangos</button>
    </div>
    <br>    
        <button id="veryslow">Nagyon lassú</button>
        <button id="slow">Lassú</button>
        <button id="normal">Normális</button>
        <button id="fast">Gyors</button>
        <button id="veryfast">Nagyon gyors</button>
    <div>
    <br>
        <button id="hasItEnded">Befejeződött-e</button>
        <button id="duration">Audió hossza (mp)</button>
        <button id="position">Jelenlegi pozíció</button>
        <button id="skip">Ugrás másfél perchez</button>
    </div>


<script>
    const audio = document.getElementById('audio');
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');

    let btnClick = (id, onclick) => document.getElementById(id).addEventListener("click", onclick);

    btnClick("startstop", () => audio.paused ? audio.play() : audio.pause());

    btnClick("mute", () => audio.volume = 0);
    btnClick("quite", () => audio.volume = 0.5);
    btnClick("loud", () => audio.volume = 1);

    btnClick("veryslow", () => audio.playbackRate = 0.25);
    btnClick("slow", () => audio.playbackRate = 0.5);
    btnClick("normal", () => audio.playbackRate = 1);
    btnClick("fast", () => audio.playbackRate = 2);
    btnClick("veryfast", () => audio.playbackRate = 4);

    btnClick("hasItEnded", () => {
        if (audio.ended) {
            alert("Vége");
        } else {
            alert("Még nem ért véget");
        }
    });

    document.getElementById("positive").addEventListener("click", () => {
        yes.play();
    });

    document.getElementById("negative").addEventListener("click", () => {
        no.play();
    });
    
    btnClick("duration", () => alert(audio.duration));
    btnClick("position", () => alert(audio.currentTime));
    btnClick("skip", () => audio.currentTime = 90);
</script>


</main>

</body>
</html>
