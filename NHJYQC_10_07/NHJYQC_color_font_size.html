<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>NHJYQC - Color Font Size</title>

    <style>
        div {
            background-color: #16c66b;
            width: 400px;
            margin: 10px 0;
        }

        span {
            background-color: #9b59b6;
            padding: 5px;
        }

        .inline {
            display: inline;
        }

        .block {
            display: block;
        }

        .inline-block {
            display: inline-block;
        }

        .flex {
            display: flex;
        }
    </style>
</head>
<body>
    <h1>Megjelenítési tulajdonság</h1>

    <h2>display: none:</h2>
    <div style="display: none;">
        <span>PTI Bsc 1</span>
        <span>PTI Bsc 2</span>
        <span>PTI Bsc 3</span>
    </div>

    <br>

    <h2>display: inline:</h2>
    <div class="inline">
        <span>PTI Bsc 1</span>
        <span>PTI Bsc 2</span>
        <span>PTI Bsc 3</span>
    </div>

    <br>

    <h2>display: block:</h2>
    <div class="block">
        <span>PTI Bsc 1</span>
        <span>PTI Bsc 2</span>
        <span>PTI Bsc 3</span>
    </div>

    <br>

    <h2>display: inline-block:</h2>
    <div class="inline-block">
        <span>PTI Bsc 1</span>
        <span>PTI Bsc 2</span>
        <span>PTI Bsc 3</span>
    </div>

    <br>

    <h2>display: flex:</h2>
    <div class="flex">
        <span>PTI Bsc 1</span>
        <span>PTI Bsc 2</span>
        <span>PTI Bsc 3</span>
    </div>



</body>
</html>
