<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>NHJYQC - JavaScript object to JSON String</title>
</head>
<body>
    <h3>JavaScript object to JSON String</h3>
    <strong>JSON:</strong>
    <p id="nhjyqc"></p>

    <button onclick="letrehoz()">JSON generálás</button>
    
    <script>
        function letrehoz() {
            let prognyelvek = [
                {"Név":"HTML5", "kiterjesztes":".html"},
                {"Név":"CSS3", "kiterjesztes":".css"},
                {"Név":"JavaScript", "kiterjesztes":".js"}
            ];

            document.getElementById('nhjyqc').innerHTML=JSON.stringify(prognyelvek);
        }
    </script>
</body>
</html>
