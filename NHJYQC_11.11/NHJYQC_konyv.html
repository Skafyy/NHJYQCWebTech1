<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>NHJYQC - Parse JSON file to HTML</title>
</head>
<body>
    <h1>JSON megvalósítása - JavaScript</h1>

    <h3>Könyvek listája:</h3>
    
    <div id="konyvLista"></div>



    <script>
        let  konyvekJSON = {
    "konyvek": {
        "konyv": [
            {
                "iro": "Nyékyné Dr. Gaizler Judit",
                "cim": "Java 2 I-II. - Útikalauz programozóknak 5.0",
                "kiadas": 2009
            },
            {
                "iro": "Reiter István",
                "cim": "C# programozás lépésről lépésre",
                "kiadas": 2018
            }
        ]
    }
};

    let konyvListaElem=document.getElementById("konyvLista");
    let konyvListaHTML='<ul>';

        for(let i=0;i<konyvekJSON.konyvek.konyv.length;i++){
            let konyv=konyvekJSON.konyvek.konyv[i];
            konyvListaHTML += "<li><strong>Szerző: </li></strong>" + konyv.iro + 
            "<li><strong>Cím </li></strong>" + konyv.cim + 
            "<li><strong>Kiadás: </li></strong>" + konyv.kiadas + "</li>";   
        }

        konyvListaHTML += "</ul>";

        konyvListaElem.innerHTML=konyvListaHTML;




    </script>

</body>
</html>
