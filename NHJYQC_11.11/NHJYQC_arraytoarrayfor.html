<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>title</title>
</head>
<body>

    <h1>Tömbökön belüli tömbök ciklusa</h1>
    <div id="jsonNHJYQC">


    </div>
    
    <script>
        const VIobj = {
            "name": "Varga István Hunor",
            "age": 22,
            "cars" : [
                {"name":"Toyota", "models": ["CHR", "Corolla", "Proace"]},
                {"name":"Ford", "models": ["Kuga", "Mondeo", "Mustang"]},
                {"name":"BMW", "models": ["320", "X3", "X5"]},
                {"name":"Fiat", "models": ["500", "Panda", "Tipo"]},
            ]
        }

        const jsonNHJYQC=document.getElementById('jsonNHJYQC');

        const h2 = document.createElement('h2');
        h2.innerHTML = `<span><b>${VIobj["name"]}</b></span> (${VIobj["age"]})`;
        jsonNHJYQC.appendChild(h2);

        for(let i=0;i<VIobj["cars"].length; i++){
            const h3=document.createElement('h3');
            h3.innerHTML = `<span><b>${VIobj["cars"][i]}</b></span>`;
        }

    </script>
</body>
</html>
